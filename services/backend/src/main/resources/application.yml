server:
  port: 8080

spring:
  application:
    name: backend

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Generic AI config — swap provider without code changes.
# AI_PROVIDER=openai|echo  AI_OPENAI_API_KEY=sk-...  AI_OPENAI_MODEL=gpt-4o-mini
ai:
  provider: ${AI_PROVIDER:echo}
  openai:
    base-url: ${AI_OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_OPENAI_API_KEY:}
    model: ${AI_OPENAI_MODEL:gpt-4o-mini}
