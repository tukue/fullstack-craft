services:
  backend:
    build: ./services/backend
    ports:
      - "8080:8080"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-echo}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-gpt-4o-mini}
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL:-https://api.openai.com/v1}
  frontend:
    build: ./apps/frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
